name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-scripts-and-metadata:
    name: Shell, Actions & Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: Setup actionlint
        uses: rhysd/action-setup-actionlint@v1

      - name: Run lint.sh
        run: |
          bash scripts/lint.sh --verbose

  lint-pkgbuild:
    name: PKGBUILD & Arch Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate PKGBUILD and SRCINFO in Arch Linux
        run: |
          docker run --rm \
            -v "$(pwd):/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm --needed base-devel namcap sudo git
              useradd -m builder
              printf "builder ALL=(ALL) NOPASSWD: ALL\n" > /etc/sudoers.d/builder
              chmod 440 /etc/sudoers.d/builder
              chown -R builder:builder /workspace

              su - builder -c "
                set -euo pipefail
                cd /workspace
                failed=0

                for pkg_dir in pkgs/*; do
                  [[ -d \"\${pkg_dir}\" && -f \"\${pkg_dir}/PKGBUILD\" ]] || continue
                  pkg_name=\"\$(basename \"\${pkg_dir}\")\"
                  echo \"::group::Validating \${pkg_name}\"

                  cd \"/workspace/\${pkg_dir}\"
                  if ! makepkg --printsrcinfo > .SRCINFO; then
                    echo \"[ERROR] Failed to generate .SRCINFO for \${pkg_name}\"
                    failed=1
                  fi

                  # Run namcap (ignore non-fatal warnings)
                  namcap PKGBUILD .SRCINFO || true

                  echo \"::endgroup::\"
                done

                if [[ \"\${failed}\" -ne 0 ]]; then
                  echo \"[ERROR] PKGBUILD validation failed\"
                  exit 1
                fi
                echo \"All PKGBUILDs successfully validated!\"
              "
            '
